services:
  - type: web
    name: skyline-flights
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: /tmp/skyline
      - key: AERODATABOX_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: SKYLINE_ADMIN
        sync: false
